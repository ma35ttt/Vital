name: Bug report
description: Report something that is broken, crashes or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search the existing issues first.

        **Do not include personal data** (email addresses, body measurements, progress photos,
        API keys) in screenshots or logs.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I open the Lift tab and start a rest timer...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that reliably triggers the bug.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: "Settings → About (for example: 1.1.0, versionCode 2)"
      placeholder: "1.1.0 (2)"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      description: "Settings → About phone → Android version"
      placeholder: "Android 16"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Manufacturer and model.
      placeholder: "Google Pixel 9"
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: How did you install Vital?
      options:
        - Sideloaded APK (GitHub Release)
        - Built from source
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: |
        Drag files here. For crashes, `adb logcat` output around the failure is ideal.
        Remove personal data first.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed personal data from screenshots and logs.
          required: true
