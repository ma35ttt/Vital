name: Feature request
description: Suggest a capability or an improvement to an existing screen.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Describe the problem first — it is easier to agree on the outcome
        than on a specific implementation.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What is frustrating, missing or slow today?
      placeholder: I want to log a workout without...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Vital to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other apps, workarounds or designs you have tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Today
        - Meals
        - Lift
        - Cardio
        - Weeks / Progress
        - Coach / AI
        - Sync / Account
        - Settings
        - Onboarding
        - Updates
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots or references. Do not include personal data.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions first.
          required: true
        - label: This is a single, focused request rather than a bundle of unrelated ideas.
          required: true
