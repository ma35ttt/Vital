version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
          - "com.google.android.material*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      firebase:
        patterns:
          - "com.google.firebase*"
          - "com.google.android.gms*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
