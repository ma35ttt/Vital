name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Signed APK and update manifest
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Require the release keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the release signing secrets first."
            echo "See docs/GITHUB_SETUP.md, section 4."
            exit 1
          fi

      - name: Decode the keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vital-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/vital-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build and test
        run: |
          ./gradlew testDebugUnitTest assembleRelease \
            -Pvital.updateManifestUrl="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" \
            --stacktrace

      - name: Prepare release assets
        id: assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CODE=$(grep -m1 -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts \
            | grep -oE '[0-9]+' | head -1)
          APK="app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "Vital-${VERSION}.apk"
          SHA=$(sha256sum "Vital-${VERSION}.apk" | awk '{print $1}')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Write latest.json
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.assets.outputs.tag }}/Vital-${{ steps.assets.outputs.version }}.apk"
          NOTES=$(cat updates/release-notes.json)
          jq -n \
            --argjson code "${{ steps.assets.outputs.code }}" \
            --arg name "${{ steps.assets.outputs.version }}" \
            --arg url "$URL" \
            --arg sha "${{ steps.assets.outputs.sha }}" \
            --argjson notes "$NOTES" \
            '{versionCode:$code,versionName:$name,apkUrl:$url,sha256:$sha,notes:$notes,publishedAt:(now|strftime("%Y-%m-%d"))}' \
            > latest.json
          cat latest.json

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.assets.outputs.tag }}
          name: Vital ${{ steps.assets.outputs.version }}
          generate_release_notes: true
          files: |
            Vital-${{ steps.assets.outputs.version }}.apk
            latest.json
          fail_on_unmatched_files: true
